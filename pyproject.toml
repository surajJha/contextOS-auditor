[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextos-auditor"
version = "0.1.0"
description = "The free, local-only Agent Auditor -- attach one line to a CrewAI/LangGraph/AutoGen/OpenAI-Agents-SDK agent and watch its real token cost live. No signup, no telemetry, no data leaves your machine. Noncommercial use only -- see LICENSE."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "ContextOS contributors" }]
keywords = ["llm", "agents", "tokens", "cost", "observability", "crewai", "langgraph", "autogen", "openai-agents"]
classifiers = [
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
]
# Zero required runtime dependencies -- every framework SDK below is an
# optional extra, never a hard install requirement.
dependencies = []

[project.optional-dependencies]
crewai = ["crewai>=0.80"]
langgraph = ["langchain-core>=0.3"]
autogen = ["autogen-core>=0.4"]
openai-agents = ["openai-agents>=0.0.3"]
tiktoken = ["tiktoken>=0.7"]
all = ["crewai>=0.80", "langchain-core>=0.3", "autogen-core>=0.4", "openai-agents>=0.0.3", "tiktoken>=0.7"]
dev = ["pytest>=7.0"]

[project.scripts]
contextos-auditor = "contextos_auditor.cli:main"

[project.urls]
Homepage = "https://github.com/surajJha/toku"

[tool.hatch.build.targets.wheel]
packages = ["contextos_auditor"]
