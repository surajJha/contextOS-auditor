name: Bug report
description: Something the auditor measured, printed or crashed on looks wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Auditor records locally by default; optional OpenTelemetry export goes
        to your configured endpoint. We cannot see your session, so please
        provide a minimal reproduction and reviewed diagnostics.

        **Please do not paste raw session data.** It can contain your source code
        and prompts. Redacted excerpts or the summary numbers are enough.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: |
        If `contextos-auditor demo` also shows it, say so — that is the easiest
        case for us to fix, because it needs no agent and no API key.
      placeholder: |
        1. python -m pip install "contextos-auditor[langgraph]"
        2. attach with ...
        3. run `contextos-auditor watch`
        4. the savings number shows ...
    validations:
      required: true

  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options:
        - CrewAI
        - LangGraph
        - AutoGen
        - OpenAI Agents SDK
        - None (demo / report / history only)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `contextos-auditor --version`
      placeholder: "0.3.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "3.12 on macOS 15"
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Reviewed diagnostics (optional)
      description: |
        On 0.3.0+, run `contextos-auditor doctor --check-recording --json`
        and add `--framework crewai` (or your framework) if relevant.
        Review the minimal JSON before pasting. Do not paste raw console
        tracebacks or session files; they may contain private data.
      render: json
