name: Wrong numbers / measurement dispute
description: The savings, waste or cost figure does not match what you believe is true.
labels: ["measurement"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most important kind of issue you can file. The whole point of
        this tool is that its numbers are defensible, so a number we cannot
        justify is a bug in the product, not a misunderstanding on your part.

        Useful context before you write: Auditor reports **estimated opportunities**,
        not guaranteed bill reductions. It cannot see whether your provider billed a cached
        prefix at a discount, and it cannot model how the agent's trajectory
        would have changed if the waste were removed.

  - type: textarea
    id: number
    attributes:
      label: Which number, and what it said
      placeholder: "The prompt-token total differs from the SDK usage for the same completed calls."
    validations:
      required: true

  - type: textarea
    id: why-wrong
    attributes:
      label: Why you think it is wrong
      description: Billing data, a manual token count, or a reasoned argument all work.
    validations:
      required: true

  - type: textarea
    id: export
    attributes:
      label: Exported JSON (optional, please redact)
      description: |
        Provide only a minimal sanitized excerpt needed to explain the discrepancy.
        Session exports can include source code, tool arguments/results, prompts,
        paths, and secrets missed by pattern-based redaction. Do not paste a raw
        export. A doctor support report helps diagnose the environment, not totals.
      render: json
