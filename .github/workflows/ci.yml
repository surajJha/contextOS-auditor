name: Installed package checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build distributable
        run: |
          python -m pip install build
          python -m build --outdir artifacts
      - name: Test installed sdist outside checkout
        shell: bash
        run: python scripts/check_distribution.py artifacts/*.tar.gz --results results
      - name: Upload environment and regression evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: auditor-${{ matrix.os }}-${{ matrix.python }}
          path: results/
          if-no-files-found: warn
